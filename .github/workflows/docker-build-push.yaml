name: Build and Push Docker Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: static-cicd-demo

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

          docker build \
            --build-arg VERSION=${{ steps.meta.outputs.short_sha }} \
            --build-arg BUILD_TIME=${{ steps.meta.outputs.build_time }} \
            --build-arg ENVIRONMENT=${{ steps.meta.outputs.environment }} \
            -t ${IMAGE_REPOSITORY}:${{ steps.meta.outputs.short_sha }} \
            -t ${IMAGE_REPOSITORY}:${{ github.ref_name }} \
            .

      - name: Push Docker image
        run: |
          IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

          docker push ${IMAGE_REPOSITORY}:${{ steps.meta.outputs.short_sha }}
          docker push ${IMAGE_REPOSITORY}:${{ github.ref_name }}

      - name: Print image details
        run: |
          echo "Image pushed successfully"
          echo "Image: ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ steps.meta.outputs.short_sha }}"
          echo "Environment: ${{ steps.meta.outputs.environment }}"
          echo "Build time: ${{ steps.meta.outputs.build_time }}"
  deployment:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    name: Update Helm Chart    
    steps:
      - name: Clone Deployment Repo
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0
        with:
          repository: hashilbasheer/static-apps-helm-chart
          token: ${{ secrets.DEPLOY_GITHUB_PAT }}
      - name: Get Short sha
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} |cut -c1-7)" >> $GITHUB_ENV
      - name: Update onboarding values
        uses: mikefarah/yq@bbdd97482f2d439126582a59689eb1c855944955 #v4.44.3
        with:
          cmd: yq -i '.image.tag = "'$SHORT_SHA'"' static-app/values.yaml     
      - name: Update Image Version in the HelmChart values.yaml
        id: deployment
        run: |
          git config --global user.name "hashilbasheer" 
          git config --global user.email "hashilbasheer@gmail.com" 
          git add static-app/values.yaml
          git commit -m "image tag changed to '$SHORT_SHA' "
          git push origin
