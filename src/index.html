<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitOps Deployment Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="header">
        <p class="badge">Production release</p>
        <h1>GitOps Deployment Dashboard</h1>
        <p class="subtitle">
          Live release information deployed through GitHub Actions, Docker, Helm, Argo CD, and Kubernetes Gateway API.
        </p>
      </div>

      <table class="details-table">
        <tbody>
          <tr>
            <th>Status</th>
            <td>
              <span class="status-dot"></span>
              <span id="status">Healthy</span>
            </td>
          </tr>
          <tr>
            <th>Environment</th>
            <td id="environment">loading...</td>
          </tr>
          <tr>
            <th>Commit ID</th>
            <td id="app-version">loading...</td>
          </tr>
          <tr>
            <th>Build Time</th>
            <td id="build-time">loading...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="./version.js"></script>
  <script src="./app.js"></script>
</body>
</html>
